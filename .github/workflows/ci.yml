name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 11.19.0

jobs:
  quality-build-docs:
    name: Quality, build, Storybook and wiki
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run simulation tests
        run: pnpm test:sim

      - name: Build game
        run: pnpm build

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Check and build wiki
        run: pnpm wiki:check

      - name: Upload static build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: static-builds-${{ github.sha }}
          path: |
            dist/
            storybook-static/
            wiki-site/.vitepress/dist/
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    name: Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-build-docs
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke
        run: pnpm test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
