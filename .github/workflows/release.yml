name: Manual checkpoint release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact v-prefixed version matching package.json (for example v0.1.0-alpha.1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: true
        type: boolean
      dry_run:
        description: Build and validate artifacts without creating a tag or release
        required: true
        default: true
        type: boolean
      compacted_log:
        description: Repository-relative compacted log to attach
        required: true
        default: logs/compacted/WAVE-01.md
        type: string

permissions:
  contents: write

concurrency:
  group: checkpoint-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.16.0
  PNPM_VERSION: 11.19.0
  RELEASE_VERSION: ${{ inputs.version }}
  COMPACTED_LOG: ${{ inputs.compacted_log }}

jobs:
  checkpoint:
    name: Validate and package checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release inputs and ref
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must be a valid v-prefixed semantic version." >&2
            exit 1
          }
          expected="v$(node -p "require('./package.json').version")"
          [[ "$RELEASE_VERSION" == "$expected" ]] || {
            echo "Input $RELEASE_VERSION does not match package.json $expected." >&2
            exit 1
          }
          [[ -f "$COMPACTED_LOG" ]] || {
            echo "Compacted log does not exist: $COMPACTED_LOG" >&2
            exit 1
          }
          notes="release-notes/${RELEASE_VERSION}.md"
          [[ -f "$notes" ]] || {
            echo "Structured release notes do not exist: $notes" >&2
            exit 1
          }
          if [[ "$DRY_RUN" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publishing is allowed only from the default main branch." >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "Tag already exists: $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Run checkpoint quality gate
        run: |
          pnpm check
          pnpm typecheck
          pnpm test
          pnpm test:sim
          pnpm build
          pnpm build:storybook
          pnpm wiki:check

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run browser smoke
        run: |
          CI=1 pnpm exec playwright test --config tests/ui/foundation/playwright.config.ts
          pnpm test:e2e

      - name: Preserve browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-failure-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            tests/ui/foundation/baselines/linux/
          if-no-files-found: warn
          retention-days: 14

      - name: Assemble release artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          tar -czf "release-artifacts/petty-lord-${RELEASE_VERSION}.tar.gz" -C dist .
          tar -czf "release-artifacts/petty-lord-storybook-${RELEASE_VERSION}.tar.gz" -C storybook-static .
          tar -czf "release-artifacts/petty-lord-wiki-${RELEASE_VERSION}.tar.gz" -C wiki-site/.vitepress/dist .
          cp "$COMPACTED_LOG" "release-artifacts/compacted-log.md"
          cp KNOWN_ISSUES.md "release-artifacts/known-issues.md"
          cp "release-notes/${RELEASE_VERSION}.md" "release-artifacts/release-notes.md"
          {
            echo "# Test summary"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Version: $RELEASE_VERSION"
            echo "Node: $NODE_VERSION"
            echo "pnpm: $PNPM_VERSION"
            echo
            echo "Passed: check, typecheck, unit, simulation, game build, Storybook build, wiki check, Chromium smoke."
          } > release-artifacts/test-summary.md
          (cd release-artifacts && sha256sum *.gz *.md > checksums.sha256)

      - name: Smoke-test extracted game artifact
        run: |
          set -euo pipefail
          mkdir -p release-smoke/game
          tar -xzf "release-artifacts/petty-lord-${RELEASE_VERSION}.tar.gz" -C release-smoke/game
          RELEASE_SMOKE_DIR=release-smoke/game pnpm test:release-smoke

      - name: Upload dry-run or release bundle
        uses: actions/upload-artifact@v7
        with:
          name: checkpoint-${{ inputs.version }}-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Create annotated tag
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_VERSION" -m "The Petty Lord $RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "$RELEASE_VERSION"

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          prerelease_flag=""
          if [[ "$PRERELEASE" == "true" ]]; then prerelease_flag="--prerelease"; fi
          gh release create "$RELEASE_VERSION" release-artifacts/* \
            --title "The Petty Lord $RELEASE_VERSION" \
            --notes-file release-artifacts/release-notes.md \
            $prerelease_flag

      - name: Verify published tag and release artifacts
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse "${RELEASE_VERSION}^{}")" == "$GITHUB_SHA" ]]
          release_json="$(gh release view "$RELEASE_VERSION" --json tagName,isPrerelease)"
          [[ "$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(j.tagName)' "$release_json")" == "$RELEASE_VERSION" ]]
          [[ "$(node -e 'const j=JSON.parse(process.argv[1]); process.stdout.write(String(j.isPrerelease))' "$release_json")" == "$PRERELEASE" ]]
          mkdir -p release-verify
          gh release download "$RELEASE_VERSION" --dir release-verify
          (cd release-verify && sha256sum -c checksums.sha256)
          tar -tzf "release-verify/petty-lord-${RELEASE_VERSION}.tar.gz" >/dev/null
          tar -tzf "release-verify/petty-lord-storybook-${RELEASE_VERSION}.tar.gz" >/dev/null
          tar -tzf "release-verify/petty-lord-wiki-${RELEASE_VERSION}.tar.gz" >/dev/null
